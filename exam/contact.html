    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pizzería lokistokis</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="about.html">Sobre Nosotros</a></li>
                <li><a href="contact.html" class="active">Contacto</a></li>

    <main>
        <section>
            <h3>Contacto</h3>
            <p><strong>Nuestra dirección:</strong> Av. cobach Num. 03</p>
            <p><strong>Teléfono:</strong>612 212 5669</p>
        </section>

        <section>
            <h3>Envíanos un mensaje</h3>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                </div>

                <button type="submit">Enviar</button>
            </form>
        </section>

        <div class="map-container">
            <h3>¿Dónde estamos?</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1820.0606156492222!2d-110.29975271502674!3d24.167480758866628!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2smx!4v1792777743513!5m2!1ses-419!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
    </main>

    <footer>
        <p>2025 Pizzería lokistokis</p>
    </footer>
